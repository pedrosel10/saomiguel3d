<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>São Miguel 3D - Experiência Isométrica Interativa</title>
  <meta name="description"
    content="Visualizador 3D isométrico interativo com Three.js, iluminação HDRI, reflexos internos azuis e animações em tempo real com GSAP.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <!-- Localização e Descrição H2 no Canto Superior Esquerdo -->
  <header class="header-brand">
    <div class="header-location">
      <span class="location-text">GRAMADO & CANELA</span>
    </div>
    <h2 class="brand-subtitle">
      Serviços de engenharia integrando projeto, planejamento e gerenciamento de obras, engenharia estrutural e PPCI, da
      viabilidade técnica à entrega, com inovação, sustentabilidade, transparência e total conformidade às normas.
    </h2>
  </header>

  <!-- Título H1 no Canto Inferior Direito -->
  <footer class="footer-description">
    <!-- Gancho de Guindaste (Animação de Entrada) -->
    <div id="crane-hook" class="crane-hook">
      <img src="./gancho.webp" alt="Gancho de Guindaste" class="hook-image" />
    </div>

    <h1 id="brand-title" class="brand-title">Engenharia<br>e construção.</h1>
  </footer>

  <!-- Canvas 3D -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Tela de Carregamento Orbital (Preta & Levíssima) -->
  <div id="loader-screen" class="loader-container loader-orbital">
    <div class="orbital-loader">
      <svg class="orbital-svg" viewBox="0 0 200 200">
        <!-- Órbita 1 (Interna - 1 Ponto) -->
        <g class="orbit-group orbit-1" id="orbit-1">
          <circle class="orbit-path" cx="100" cy="100" r="26" />
          <circle class="orbit-dot dot-1" cx="100" cy="74" r="3.5" />
        </g>

        <!-- Órbita 2 (Média - 2 Pontos) -->
        <g class="orbit-group orbit-2" id="orbit-2">
          <circle class="orbit-path" cx="100" cy="100" r="50" />
          <circle class="orbit-dot dot-2a" cx="100" cy="50" r="3.5" />
          <circle class="orbit-dot dot-2b" cx="100" cy="150" r="3.5" />
        </g>

        <!-- Órbita 3 (Externa - 3 Pontos) -->
        <g class="orbit-group orbit-3" id="orbit-3">
          <circle class="orbit-path" cx="100" cy="100" r="74" />
          <circle class="orbit-dot dot-3a" cx="100" cy="26" r="3.5" />
          <circle class="orbit-dot dot-3b" cx="164.08" cy="137" r="3.5" />
          <circle class="orbit-dot dot-3c" cx="35.92" cy="137" r="3.5" />
        </g>
      </svg>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
